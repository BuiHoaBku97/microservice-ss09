spring.application.name=gateway-service
server.port=8080

# Eureka client configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Use lower case service IDs for routing (ensure consistent matching)
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Manual routes for project services
# Pharmacy service (forwards /pharmacy-service/** -> pharmacy-service)
spring.cloud.gateway.routes[0].id=pharmacy-service
spring.cloud.gateway.routes[0].uri=lb://pharmacy-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/pharmacy-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# Debug logging for troubleshooting
logging.level.org.springframework.cloud.gateway=DEBUG
